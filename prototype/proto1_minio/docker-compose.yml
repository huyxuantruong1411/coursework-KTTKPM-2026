version: '3.8'
services:
  proto-minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9011:9000" # Dời sang 9011 để tránh đụng manga-minio
  proto-api:
    image: python:3.10-slim
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "pip install fastapi uvicorn minio && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8011:8000" # API chạy ở 8011
    depends_on:
      - proto-minio
