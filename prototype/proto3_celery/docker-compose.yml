version: '3.8'
services:
  proto-redis-broker:
    image: redis:alpine
    # Tương tự, ẩn hoàn toàn Redis khỏi host
  proto-api:
    image: python:3.10-slim
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "pip install fastapi uvicorn celery redis && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8013:8000" # API chạy ở 8013
    depends_on:
      - proto-redis-broker
  proto-worker:
    image: python:3.10-slim
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "pip install celery redis && celery -A worker.celery_app worker --loglevel=info"
    depends_on:
      - proto-redis-broker
